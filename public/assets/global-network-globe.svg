<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none" role="img" aria-label="Global associate network connecting India with UAE, Saudi Arabia and Kuwait">
  <defs>
    <radialGradient id="globeShade" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#E8EEF5"/>
      <stop offset="100%" stop-color="#D5E0EC"/>
    </radialGradient>
    <pattern id="globeDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#9AAEBF" opacity="0.45"/>
    </pattern>
    <clipPath id="globeClip">
      <circle cx="310" cy="220" r="188"/>
    </clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062E54" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Globe base -->
  <circle cx="310" cy="220" r="188" fill="url(#globeShade)" filter="url(#softGlow)"/>
  <circle cx="310" cy="220" r="188" fill="url(#globeDots)" opacity="0.7"/>
  <circle cx="310" cy="220" r="188" stroke="#C5D3E0" stroke-width="2"/>

  <!-- Latitude / longitude hints -->
  <g clip-path="url(#globeClip)" opacity="0.35" stroke="#90A4B8" stroke-width="1">
    <ellipse cx="310" cy="220" rx="188" ry="60"/>
    <ellipse cx="310" cy="220" rx="188" ry="115"/>
    <ellipse cx="310" cy="140" rx="150" ry="40"/>
    <ellipse cx="310" cy="300" rx="150" ry="40"/>
    <path d="M310 32 C390 90 390 350 310 408"/>
    <path d="M310 32 C230 90 230 350 310 408"/>
    <path d="M180 80 C250 120 250 320 180 360"/>
    <path d="M440 80 C370 120 370 320 440 360"/>
  </g>

  <!-- Left gold arc -->
  <path d="M135 145 C105 200 105 265 145 320" stroke="#D99A1B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="132" cy="165" r="5" fill="#D99A1B"/>
  <circle cx="128" cy="250" r="5" fill="#D99A1B"/>

  <!-- Soft landmasses (Middle East / Asia tone) -->
  <g clip-path="url(#globeClip)" fill="#B7C6D4" opacity="0.55">
    <path d="M250 145 C270 130 295 128 310 142 C330 130 355 135 372 155 C390 175 395 205 385 230 C375 255 350 268 325 265 C305 280 275 275 258 255 C240 230 235 185 250 145Z"/>
    <path d="M360 165 C375 155 400 158 415 175 C430 195 438 220 425 245 C410 268 385 275 368 260 C355 245 348 200 360 165Z"/>
  </g>

  <!-- India silhouette (stylized) -->
  <g clip-path="url(#globeClip)">
    <path d="M318 155
      C330 148 342 155 348 168
      C356 185 360 205 352 225
      C346 242 338 255 332 270
      C328 282 322 295 316 305
      C310 295 304 278 300 262
      C294 242 288 222 292 205
      C296 185 304 165 318 155Z" fill="#031F3C"/>
    <path d="M332 268 C340 278 348 292 352 308 C344 302 334 295 326 286 C328 278 330 272 332 268Z" fill="#031F3C"/>
  </g>

  <!-- Dashed connection arcs from India -->
  <path d="M330 210 C290 160 250 150 230 170" stroke="#D99A1B" stroke-width="2.2" stroke-dasharray="6 5" fill="none"/>
  <path d="M335 215 C310 175 285 165 265 185" stroke="#D99A1B" stroke-width="2.2" stroke-dasharray="6 5" fill="none"/>
  <path d="M340 220 C330 185 318 170 305 178" stroke="#D99A1B" stroke-width="2.2" stroke-dasharray="6 5" fill="none"/>

  <!-- Pins -->
  <!-- India -->
  <g transform="translate(330 200)">
    <path d="M0 -18 C8 -18 14 -11 14 -3 C14 7 0 20 0 20 C0 20 -14 7 -14 -3 C-14 -11 -8 -18 0 -18Z" fill="#D99A1B"/>
    <circle cx="0" cy="-5" r="4.5" fill="#031F3C"/>
  </g>
  <!-- Kuwait -->
  <g transform="translate(228 168)">
    <path d="M0 -16 C7 -16 12 -10 12 -3 C12 6 0 18 0 18 C0 18 -12 6 -12 -3 C-12 -10 -7 -16 0 -16Z" fill="#D99A1B"/>
    <circle cx="0" cy="-4" r="4" fill="#031F3C"/>
    <text x="0" y="34" text-anchor="middle" fill="#031F3C" font-family="Manrope, Inter, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">KUWAIT</text>
  </g>
  <!-- Saudi Arabia -->
  <g transform="translate(268 182)">
    <path d="M0 -16 C7 -16 12 -10 12 -3 C12 6 0 18 0 18 C0 18 -12 6 -12 -3 C-12 -10 -7 -16 0 -16Z" fill="#D99A1B"/>
    <circle cx="0" cy="-4" r="4" fill="#031F3C"/>
    <text x="0" y="34" text-anchor="middle" fill="#031F3C" font-family="Manrope, Inter, sans-serif" font-size="12" font-weight="800" letter-spacing="0.8">SAUDI ARABIA</text>
  </g>
  <!-- UAE -->
  <g transform="translate(305 175)">
    <path d="M0 -16 C7 -16 12 -10 12 -3 C12 6 0 18 0 18 C0 18 -12 6 -12 -3 C-12 -10 -7 -16 0 -16Z" fill="#D99A1B"/>
    <circle cx="0" cy="-4" r="4" fill="#031F3C"/>
    <text x="18" y="8" text-anchor="start" fill="#031F3C" font-family="Manrope, Inter, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">UAE</text>
  </g>
</svg>
